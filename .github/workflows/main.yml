# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snake

# Controls when the action will run.
on:
  schedule:
      # every 12 hours
    - cron: "0 */12 * * *"

  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:
  
  # Also run on every push on the master branch
  push:
    branches:
    - main

permissions:
  contents: write

# The sequence of runs in this workflow:
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
    
      - name: Generate the snake files in './dist/'
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cache the streak card so the README never shows the public instance's
      # intermittent "Failed to retrieve contributions" error.
      - name: Fetch streak stats card into './dist/'
        run: |
          url="https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=dark&hide_border=false"
          for attempt in 1 2 3; do
            if curl -sfL -m 30 "$url" -o streak.svg && grep -q "Total Contributions" streak.svg && ! grep -q "Failed" streak.svg; then
              mv streak.svg dist/streak-stats.svg
              break
            fi
            sleep 20
          done
          # Keep the last good card if every attempt failed
          if [ ! -f dist/streak-stats.svg ]; then
            curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/output/streak-stats.svg" -o dist/streak-stats.svg || true
          fi

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
